# TWNetOptimizer v0.7
# Conservative defaults for public/complex plugin environments.

mode: optimize-safe

sampling:
  top-packet-types: 5

burst:
  outbound-packets-per-second: 800
  outbound-observed-bytes-per-second: 1048576

optimizer:
  enabled: true

  metadata-dedupe:
    enabled: true
    refresh-ms: 30000

  ui-dedupe:
    enabled: true
    # State is tracked per logical UI target. Exact unchanged state is suppressed.
    # A refresh is still forwarded periodically.
    refresh-ms: 30000

  # Disabled by default for maximum compatibility with RPG / Slimefun / skill visuals.
  particle-throttle:
    enabled: false
    max-per-second: 500
    adaptive: true
    adaptive-max-per-second: 250
    high-ping-ms: 180

  cache:
    stale-entry-ms: 300000

latency-guardian:
  enabled: true
  combat-window-ms: 2500

  # During COMBAT, unchanged Metadata/UI periodic refreshes may be deferred
  # briefly. Real state changes are never delayed.
  combat-refresh-deferral-ms: 5000

  handoff-probe-interval-ms: 100
  handoff-sample-limit: 128
  handoff-pressure-ms: 60

  # Netty channel writability is sampled only, never changed by TWNetOptimizer.
  backpressure-probe-interval-ms: 50

  cosmetic:
    pressure-particle-max-per-second: 150
    combat-particle-max-per-second: 100

trace:
  default-seconds: 10
  max-seconds: 60
  top-entities: 15
  top-virtual-entities: 15

logging:
  log-bursts-to-console: false
