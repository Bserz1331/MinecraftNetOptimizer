name: Build

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify
        run: mvn -B -ntp verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: TWNetOptimizer
          path: target/TWNetOptimizer-*.jar
          if-no-files-found: error
