name: Maven verify

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify with Maven
        run: mvn -B -ntp verify
