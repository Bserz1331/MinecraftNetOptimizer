name: Compatibility report
description: Report Paper or PacketEvents compatibility results
title: "[Compatibility]: "
body:
  - type: input
    id: minecraft-paper
    attributes:
      label: Minecraft / Paper version
      placeholder: Paper 1.20.4 build ...
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: Java 17.0.x
    validations:
      required: true
  - type: input
    id: packetevents-version
    attributes:
      label: PacketEvents version
      placeholder: PacketEvents 2.13.0
    validations:
      required: true
  - type: input
    id: twnetoptimizer-version
    attributes:
      label: MinecraftNetOptimizer version
      placeholder: 0.8.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and major plugins
      description: Include server implementation, startup mode, and plugins that touch packets, entities, or combat.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste /netdebug status and /netdebug lifecycle output.
      render: text
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works as expected
        - Works with warnings
        - Does not work
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes and logs
      description: Include reproduction steps, errors, and relevant log excerpts.
    validations:
      required: true
